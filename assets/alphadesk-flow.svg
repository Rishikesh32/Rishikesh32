<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-label="AlphaDesk agent flow: a research question goes to a supervisor agent, which delegates to market data, research, quant and risk agents; their results go to a report writer and then to human approval">
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0" stop-color="#1b1446"/>
      <stop offset="1" stop-color="#04050d"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <clipPath id="frame"><rect width="1000" height="500" rx="18"/></clipPath>
    <style>
      .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .sans { font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
      .wire { fill: none; stroke: url(#edge); stroke-width: 1.6; stroke-opacity: .45; stroke-dasharray: 5 6; animation: dash 1.4s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -22; } }
      .node { fill: #0c0f22; stroke: #8b5cf6; stroke-opacity: .55; stroke-width: 1.4; }
      .hot { animation: hot 6s ease-in-out infinite; }
      @keyframes hot { 0%, 100% { stroke-opacity: .5; } 8% { stroke-opacity: 1; stroke: #22d3ee; } 20% { stroke-opacity: .5; } }
      .label { fill: #eef0ff; font-size: 16px; font-weight: 600; }
      .sub { fill: #8e93b5; font-size: 12px; }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="500" fill="url(#bgGlow)"/>
    <text x="28" y="40" class="mono" font-size="14" fill="#22d3ee">// alphadesk.graph()</text>
    <text x="972" y="40" class="mono" font-size="12" fill="#5f6489" text-anchor="end">every hop traced in Langfuse</text>

    <!-- wires -->
    <path id="w0" class="wire" d="M500 82 L500 112"/>
    <path id="w1" class="wire" d="M500 172 C500 210, 140 200, 140 238"/>
    <path id="w2" class="wire" d="M500 172 C500 210, 380 200, 380 238"/>
    <path id="w3" class="wire" d="M500 172 C500 210, 620 200, 620 238"/>
    <path id="w4" class="wire" d="M500 172 C500 210, 860 200, 860 238"/>
    <path id="r1" class="wire" d="M140 302 C140 340, 500 330, 500 358"/>
    <path id="r2" class="wire" d="M380 302 C380 340, 500 330, 500 358"/>
    <path id="r3" class="wire" d="M620 302 C620 340, 500 330, 500 358"/>
    <path id="r4" class="wire" d="M860 302 C860 340, 500 330, 500 358"/>
    <path id="w5" class="wire" d="M500 402 L500 428"/>

    <!-- packets: a request flowing through the graph -->
    <g>
      <circle r="5" fill="#22d3ee"><animateMotion dur="6s" begin="0s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.08;1" calcMode="linear"><mpath xlink:href="#w0"/></animateMotion></circle>
      <circle r="5" fill="#22d3ee"><animateMotion dur="6s" begin="0s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.12;0.32;1" calcMode="linear"><mpath xlink:href="#w1"/></animateMotion></circle>
      <circle r="5" fill="#38bdf8"><animateMotion dur="6s" begin="0s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.12;0.32;1" calcMode="linear"><mpath xlink:href="#w2"/></animateMotion></circle>
      <circle r="5" fill="#818cf8"><animateMotion dur="6s" begin="0s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.12;0.32;1" calcMode="linear"><mpath xlink:href="#w3"/></animateMotion></circle>
      <circle r="5" fill="#a78bfa"><animateMotion dur="6s" begin="0s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.12;0.32;1" calcMode="linear"><mpath xlink:href="#w4"/></animateMotion></circle>
      <circle r="5" fill="#c084fc"><animateMotion dur="6s" begin="0s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.48;0.66;1" calcMode="linear"><mpath xlink:href="#r1"/></animateMotion></circle>
      <circle r="5" fill="#c084fc"><animateMotion dur="6s" begin="0s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.48;0.66;1" calcMode="linear"><mpath xlink:href="#r2"/></animateMotion></circle>
      <circle r="5" fill="#c084fc"><animateMotion dur="6s" begin="0s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.48;0.66;1" calcMode="linear"><mpath xlink:href="#r3"/></animateMotion></circle>
      <circle r="5" fill="#c084fc"><animateMotion dur="6s" begin="0s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.48;0.66;1" calcMode="linear"><mpath xlink:href="#r4"/></animateMotion></circle>
      <circle r="5" fill="#f472b6"><animateMotion dur="6s" begin="0s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.76;0.86;1" calcMode="linear"><mpath xlink:href="#w5"/></animateMotion></circle>
    </g>

    <!-- question -->
    <rect x="390" y="50" width="220" height="32" rx="16" fill="#22d3ee" fill-opacity=".08" stroke="#22d3ee" stroke-opacity=".5"/>
    <text x="500" y="71" class="mono" font-size="13" fill="#c9f5fd" text-anchor="middle">"Is NVDA overextended?"</text>

    <!-- supervisor -->
    <rect x="380" y="112" width="240" height="60" rx="14" fill="#22d3ee" fill-opacity=".18" filter="url(#soft)"/>
    <rect x="380" y="112" width="240" height="60" rx="14" class="node" style="stroke:#22d3ee;stroke-opacity:.9"/>
    <text x="500" y="139" class="sans label" text-anchor="middle">Supervisor agent</text>
    <text x="500" y="158" class="mono sub" text-anchor="middle">LangGraph · plans + delegates</text>

    <!-- specialists -->
    <g>
      <rect x="45" y="238" width="190" height="64" rx="12" class="node hot" style="animation-delay:1.9s"/>
      <text x="140" y="265" class="sans label" text-anchor="middle">Market data</text>
      <text x="140" y="285" class="mono sub" text-anchor="middle">prices via MCP</text>

      <rect x="285" y="238" width="190" height="64" rx="12" class="node hot" style="animation-delay:2s"/>
      <text x="380" y="265" class="sans label" text-anchor="middle">Research</text>
      <text x="380" y="285" class="mono sub" text-anchor="middle">GraphRAG on filings</text>

      <rect x="525" y="238" width="190" height="64" rx="12" class="node hot" style="animation-delay:2.1s"/>
      <text x="620" y="265" class="sans label" text-anchor="middle">Quant</text>
      <text x="620" y="285" class="mono sub" text-anchor="middle">backtests in sandbox</text>

      <rect x="765" y="238" width="190" height="64" rx="12" class="node hot" style="animation-delay:2.2s"/>
      <text x="860" y="265" class="sans label" text-anchor="middle">Risk</text>
      <text x="860" y="285" class="mono sub" text-anchor="middle">exposure + limits</text>
    </g>

    <!-- report -->
    <rect x="390" y="358" width="220" height="44" rx="12" class="node hot" style="animation-delay:4s"/>
    <text x="500" y="386" class="sans label" text-anchor="middle">Report writer</text>

    <!-- human -->
    <rect x="370" y="428" width="260" height="46" rx="12" fill="#f472b6" fill-opacity=".1" stroke="#f472b6" stroke-opacity=".8" stroke-width="1.4"/>
    <text x="500" y="457" class="sans label" text-anchor="middle" fill="#fbcfe8">✋ Human approval</text>

    <!-- side notes -->
    <g class="mono" font-size="11.5" fill="#5f6489">
      <text x="28" y="470">frontier plans · open-weight extracts</text>
      <text x="972" y="470" text-anchor="end">evals gate every release</text>
    </g>

    <rect x="0.5" y="0.5" width="999" height="499" rx="18" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
  </g>
</svg>
