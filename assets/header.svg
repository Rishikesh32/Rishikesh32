<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Rishikesh Ombase, Agentic AI Architect">
  <defs>
    <linearGradient id="name" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="700" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#f472b6"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="700 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.25" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobA"><stop offset="0" stop-color="#1e3a8a" stop-opacity=".9"/><stop offset="1" stop-color="#1e3a8a" stop-opacity="0"/></radialGradient>
    <radialGradient id="blobB"><stop offset="0" stop-color="#5b21b6" stop-opacity=".8"/><stop offset="1" stop-color="#5b21b6" stop-opacity="0"/></radialGradient>
    <radialGradient id="blobC"><stop offset="0" stop-color="#9d174d" stop-opacity=".6"/><stop offset="1" stop-color="#9d174d" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".04"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="320" rx="20"/></clipPath>
    <style>
      .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .sans { font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
      .tw { animation: tw 3s ease-in-out infinite; }
      @keyframes tw { 0%, 100% { opacity: .15; } 50% { opacity: .9; } }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: 960px 160px; }
      @keyframes pulse { 0%, 100% { transform: scale(1); opacity: .9; } 50% { transform: scale(1.15); opacity: 1; } }
      .link { stroke-dasharray: 4 6; animation: dash 1.6s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -20; } }
      .fadeup { animation: fadeup 1.2s ease-out both; }
      .d1 { animation-delay: .2s; } .d2 { animation-delay: .5s; } .d3 { animation-delay: .8s; }
      @keyframes fadeup { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
      .live { animation: live 1.6s ease-in-out infinite; }
      @keyframes live { 50% { opacity: .3; } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="#04050d"/>

    <!-- drifting aurora -->
    <circle cx="180" cy="40" r="260" fill="url(#blobA)">
      <animate attributeName="cx" values="180;320;180" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle cx="960" cy="200" r="280" fill="url(#blobB)">
      <animate attributeName="cy" values="200;120;200" dur="16s" repeatCount="indefinite"/>
    </circle>
    <circle cx="620" cy="340" r="240" fill="url(#blobC)">
      <animate attributeName="cx" values="620;520;620" dur="20s" repeatCount="indefinite"/>
    </circle>
    <rect width="1200" height="320" fill="url(#grid)"/>

    <!-- twinkling particles -->
    <g fill="#c7d2fe">
      <circle class="tw" cx="60" cy="40" r="1.6" style="animation-delay:.1s"/>
      <circle class="tw" cx="140" cy="290" r="1.3" style="animation-delay:1.2s"/>
      <circle class="tw" cx="260" cy="60" r="1.2" style="animation-delay:.7s"/>
      <circle class="tw" cx="390" cy="285" r="1.6" style="animation-delay:2.1s"/>
      <circle class="tw" cx="470" cy="35" r="1.3" style="animation-delay:1.6s"/>
      <circle class="tw" cx="560" cy="270" r="1.1" style="animation-delay:.4s"/>
      <circle class="tw" cx="640" cy="60" r="1.5" style="animation-delay:2.6s"/>
      <circle class="tw" cx="700" cy="250" r="1.2" style="animation-delay:1s"/>
      <circle class="tw" cx="760" cy="40" r="1.4" style="animation-delay:.2s"/>
      <circle class="tw" cx="1120" cy="60" r="1.6" style="animation-delay:1.8s"/>
      <circle class="tw" cx="1160" cy="270" r="1.3" style="animation-delay:.9s"/>
      <circle class="tw" cx="800" cy="290" r="1.2" style="animation-delay:2.3s"/>
      <circle class="tw" cx="1080" cy="300" r="1.1" style="animation-delay:1.4s"/>
      <circle class="tw" cx="30" cy="180" r="1.2" style="animation-delay:2.8s"/>
    </g>

    <!-- neural core -->
    <g>
      <!-- links to satellite nodes -->
      <g stroke="#8b5cf6" stroke-opacity=".55" stroke-width="1.2" fill="none">
        <path class="link" d="M960 160 L800 70"/>
        <path class="link" d="M960 160 L1110 80" style="animation-delay:.3s"/>
        <path class="link" d="M960 160 L1130 230" style="animation-delay:.6s"/>
        <path class="link" d="M960 160 L820 255" style="animation-delay:.9s"/>
      </g>
      <g font-size="11" class="mono" fill="#9095b8">
        <circle cx="800" cy="70" r="5" fill="#22d3ee"/><text x="760" y="56">research</text>
        <circle cx="1110" cy="80" r="5" fill="#8b5cf6"/><text x="1080" y="66">quant</text>
        <circle cx="1130" cy="230" r="5" fill="#c084fc"/><text x="1112" y="252">risk</text>
        <circle cx="820" cy="255" r="5" fill="#f472b6"/><text x="772" y="278">mcp tools</text>
      </g>

      <!-- orbits -->
      <g fill="none" stroke="url(#ring)" stroke-width="1.4">
        <ellipse cx="960" cy="160" rx="110" ry="38" stroke-opacity=".7">
          <animateTransform attributeName="transform" type="rotate" from="0 960 160" to="360 960 160" dur="14s" repeatCount="indefinite"/>
        </ellipse>
        <ellipse cx="960" cy="160" rx="110" ry="38" stroke-opacity=".5" transform="rotate(60 960 160)">
          <animateTransform attributeName="transform" type="rotate" from="60 960 160" to="-300 960 160" dur="18s" repeatCount="indefinite"/>
        </ellipse>
        <ellipse cx="960" cy="160" rx="110" ry="38" stroke-opacity=".4" transform="rotate(120 960 160)">
          <animateTransform attributeName="transform" type="rotate" from="120 960 160" to="480 960 160" dur="22s" repeatCount="indefinite"/>
        </ellipse>
      </g>
      <!-- electrons riding the orbits -->
      <g>
        <circle r="4" fill="#22d3ee">
          <animateMotion dur="5s" repeatCount="indefinite" path="M850 160 a110 38 0 1 0 220 0 a110 38 0 1 0 -220 0"/>
        </circle>
        <circle r="3.5" fill="#f472b6">
          <animateMotion dur="7s" repeatCount="indefinite" rotate="0" path="M960 50 a40 110 0 1 0 0 220 a40 110 0 1 0 0 -220"/>
        </circle>
      </g>
      <circle cx="960" cy="160" r="46" fill="url(#glow)" class="pulse"/>
      <circle cx="960" cy="160" r="9" fill="#ffffff"/>
    </g>

    <!-- text -->
    <g>
      <text x="70" y="98" class="mono" font-size="20" fill="#22d3ee">&gt; hello world, I'm</text>
    </g>
    <g>
      <text x="66" y="172" class="sans" font-size="68" font-weight="800" letter-spacing="-2" fill="url(#name)">Rishikesh Ombase</text>
    </g>
    <g>
      <text x="70" y="216" class="sans" font-size="22"><tspan font-weight="700" fill="#eef0ff">Agentic AI Architect</tspan><tspan dx="14" fill="#9095b8">Multi-agent systems · MCP · RAG · LLMOps</tspan></text>
    </g>
    <g>
      <rect x="70" y="240" width="300" height="34" rx="17" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".16"/>
      <circle cx="90" cy="257" r="5" fill="#34d399" class="live"/>
      <text x="104" y="262" class="sans" font-size="15" fill="#c9cbe8">Open to AI Architect roles</text>
    </g>

    <rect x="0.5" y="0.5" width="1199" height="319" rx="20" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
  </g>
</svg>
